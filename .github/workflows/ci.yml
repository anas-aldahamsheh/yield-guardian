name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main gets a complete run; superseded pull request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: "3.13"
  # No Token Factory key exists in CI, so no test can reach AMD Token Factory.

jobs:
  api:
    name: API (lint, types, tests, contract staleness)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: yg
          POSTGRES_PASSWORD: yg-ci-only
          POSTGRES_DB: yg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yg -d yg_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # Database tests run against this throwaway service; they skip only when the variable is unset.
      TEST_DATABASE_URL: postgresql+asyncpg://yg:yg-ci-only@localhost:5432/yg_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (lock must match pyproject)
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check --config pyproject.toml ../../scripts/ci ../../packages/contracts/scripts
          uv run --no-sync ruff format --check --config pyproject.toml ../../scripts/ci ../../packages/contracts/scripts
      - name: Mypy (strict)
        run: |
          uv run --no-sync mypy src tests
          uv run --no-sync mypy --strict ../../scripts/ci/check_no_fixtures.py
      - name: Tests (includes the OpenAPI staleness test)
        run: uv run --no-sync pytest
      - name: Fixtures are current
        run: |
          uv run --no-sync python ../../packages/contracts/scripts/make_fixtures.py
          git diff --exit-code -- ../../packages/contracts/fixtures \
            || { echo "::error::Fixtures are stale. Run packages/contracts/scripts/make_fixtures.py and commit."; exit 1; }
      - name: Fixture leak checker works on these fixtures
        run: python3 ../../scripts/ci/check_no_fixtures.py --self-test

  web:
    name: Web (contracts, lint, types, tests, production build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TypeScript types match openapi.json
        run: |
          pnpm --filter @yield-guardian/contracts run generate
          git diff --exit-code -- packages/contracts/src \
            || { echo "::error::schema.d.ts is stale. Run pnpm contracts:generate and commit."; exit 1; }
          pnpm --filter @yield-guardian/contracts run typecheck
      - name: Detect the web app
        id: web
        run: echo "present=$([ -f apps/web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Lint
        if: steps.web.outputs.present == 'true'
        run: pnpm --filter @yield-guardian/web run lint
      - name: Typecheck
        if: steps.web.outputs.present == 'true'
        run: pnpm --filter @yield-guardian/web run typecheck
      - name: Unit tests
        if: steps.web.outputs.present == 'true'
        run: pnpm --filter @yield-guardian/web run test
      - name: Production build
        if: steps.web.outputs.present == 'true'
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @yield-guardian/web run build
      - name: No development fixtures or mock code in the production build
        if: steps.web.outputs.present == 'true'
        run: |
          python3 scripts/ci/check_no_fixtures.py --self-test
          python3 scripts/ci/check_no_fixtures.py apps/web/.next $( [ -d apps/web/public ] && echo apps/web/public )

  training:
    name: Training (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [common, secom, wafermap]
    defaults:
      run:
        working-directory: training/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect the project
        id: project
        working-directory: .
        run: echo "present=$([ -f training/${{ matrix.project }}/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
        if: steps.project.outputs.present == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: training/${{ matrix.project }}/uv.lock
      - name: Install
        if: steps.project.outputs.present == 'true'
        run: |
          if grep -q '^name = "torch"' uv.lock; then
            # The lock pins a CUDA build of PyTorch for the training GPU. CI has no GPU, so it
            # installs everything else from the lock and the CPU build of the same version.
            skip=$(grep -oP '^name = "\K(torch|triton|nvidia-[^"]+|cuda-[^"]+)(?=")' uv.lock | sort -u | sed 's/^/--no-install-package /' | tr '\n' ' ')
            uv sync --locked $skip
            version=$(grep -A1 '^name = "torch"' uv.lock | grep -oP 'version = "\K[0-9.]+' | head -1)
            uv pip install --no-deps "torch==${version}" --index-url https://download.pytorch.org/whl/cpu
          else
            uv sync --locked
          fi
      - name: Ruff
        if: steps.project.outputs.present == 'true'
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Mypy (where the project configures it)
        if: steps.project.outputs.present == 'true'
        run: |
          if grep -q '^\[tool.mypy\]' pyproject.toml; then uv run --no-sync mypy; else echo "no mypy config"; fi
      - name: Tests (raw data and GPU checks skip themselves in CI)
        if: steps.project.outputs.present == 'true'
        run: |
          if [ -d tests ]; then uv run --no-sync pytest; else echo "no tests in this project yet"; fi

  images:
    name: Images (build, compose stack through the gateway)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Artifact fetcher (lint, types, tests)
        run: |
          uvx ruff@0.17.0 check --config services/api/pyproject.toml deploy
          uvx ruff@0.17.0 format --check --config services/api/pyproject.toml deploy
          uvx --with pytest==9.1.1 mypy@2.4.0 --strict --config-file /dev/null deploy/fetch_artifacts.py deploy/tests
          uvx --python 3.13 pytest@9.1.1 -p no:cacheprovider deploy/tests
      - name: Lint Dockerfiles, shell, compose and Caddyfile
        run: |
          # DL3006: base images are tagged through ARG defaults. DL3008: Debian security updates
          # replace pinned package versions, so libgomp1 follows the base image's release.
          for f in deploy/docker/*.Dockerfile; do
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --ignore DL3006 --ignore DL3008 - < "$f"
          done
          shellcheck deploy/docker/*.sh
          printf 'POSTGRES_PASSWORD=lint\nSESSION_SECRET=lint\n' > deploy/compose/.env
          docker compose -f deploy/compose/compose.yaml config --quiet
          rm deploy/compose/.env
          for site in :80 example.com; do
            docker run --rm -v "$PWD/deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro" \
              -e SITE_ADDRESS="$site" -e TRUSTED_PROXIES=127.0.0.1/32 \
              caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile
          done
      - name: Detect the web app
        id: web
        run: echo "present=$([ -f apps/web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          tags: yield-guardian/api:ci
          load: true
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,scope=api-image,mode=max
      - name: Build the web image
        if: steps.web.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          tags: yield-guardian/web:ci
          load: true
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,scope=web-image,mode=max
      - name: Images run as non-root; sizes
        run: |
          images="yield-guardian/api:ci"
          [ "${{ steps.web.outputs.present }}" = true ] && images="$images yield-guardian/web:ci"
          for image in $images; do
            user=$(docker image inspect -f '{{.Config.User}}' "$image")
            case "$user" in ""|root|0|0:*) echo "::error::$image runs as root"; exit 1;; esac
            size=$(docker image inspect -f '{{.Size}}' "$image")
            echo "$image user=$user size=$((size / 1000000)) MB" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: No development fixtures or mock code in the web image
        if: steps.web.outputs.present == 'true'
        run: |
          out="$RUNNER_TEMP/web-image"
          cid=$(docker create yield-guardian/web:ci)
          docker cp "$cid:/app" "$out"
          docker rm "$cid"
          if find "$out" -path '*/node_modules' -prune -o \( -name mockServiceWorker.js -o -path '*/src/mocks/*' \) -print | grep -q .; then
            echo "::error::Mock code is in the web image"; exit 1
          fi
          python3 scripts/ci/check_no_fixtures.py "$out/apps/web"
      - name: Start the stack (generated secrets)
        working-directory: deploy/compose
        run: |
          umask 077
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "SESSION_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "API_IMAGE=yield-guardian/api:ci"
            echo "WEB_IMAGE=yield-guardian/web:ci"
            echo "HTTP_PORT=8080"
            echo "GIT_COMMIT=${{ github.sha }}"
          } > .env
          services="db migrate api gateway"
          [ "${{ steps.web.outputs.present }}" = true ] && services="$services web"
          # shellcheck disable=SC2086
          docker compose up -d --no-build --wait --wait-timeout 300 $services
          docker compose ps -a
      - name: Check through the gateway
        run: |
          base=http://127.0.0.1:8080
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 -o /dev/null -w 'GET /api/v1/health %{http_code}\n' "$base/api/v1/health"
          code=$(curl -sS -o "$RUNNER_TEMP/ready.json" -w '%{http_code} %{content_type}' "$base/api/v1/ready")
          echo "GET /api/v1/ready $code"
          case "$code" in 200\ *json*|503\ *json*) ;; *) echo "::error::/api/v1/ready did not answer JSON"; exit 1;; esac
          python3 -c 'import json, sys; print(json.load(open(sys.argv[1])))' "$RUNNER_TEMP/ready.json"
          curl -fsS -o /dev/null -w 'GET /api/v1/meta %{http_code}\n' "$base/api/v1/meta"
          if [ "${{ steps.web.outputs.present }}" = true ]; then
            curl -fsS -o /dev/null -w 'GET / %{http_code}\n' "$base/"
          fi
      - name: Stack logs
        if: failure()
        working-directory: deploy/compose
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        working-directory: deploy/compose
        run: |
          if [ -f .env ]; then docker compose down -v --remove-orphans; fi
          rm -f .env

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: No Token Factory key anywhere in the history
        run: |
          if git log --all -p | grep -qE 'rc-[0-9a-fA-F]{48}'; then
            echo "::error::A Token Factory key (rc- and 48 hex characters) is in the git history. Rotate it now."; exit 1
          fi
      - name: Committed files hold no secrets or raw data
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]|\.kaggle/|access_token|^data/raw/|\.pkl$|LSWMD' || true)
          if [ -n "$bad" ]; then echo "::error::These files must never be committed:"; echo "$bad"; exit 1; fi
      - uses: astral-sh/setup-uv@v7
      - name: Python dependency audit (API)
        working-directory: services/api
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt > "$RUNNER_TEMP/api-requirements.txt"
          uvx pip-audit==2.9.0 --strict --no-deps --disable-pip -r "$RUNNER_TEMP/api-requirements.txt"
      - uses: pnpm/action-setup@v4
      # No pnpm cache here: the audit installs nothing, so there is no store to save. setup-node v5
      # caches automatically when package.json names a package manager, so turn that off too.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: JavaScript dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level high
