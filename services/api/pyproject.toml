[project]
name = "yield-guardian-api"
version = "0.1.0"
description = "Yield Guardian API: data, models, investigator and every product rule"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.15",
  "sse-starlette>=3.0",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.32",
  "alembic>=1.20",
  "pgvector>=0.5",
  "psycopg[binary,pool]>=3.3",
  "structlog>=26.1",
  "httpx>=0.28",
  "orjson>=3.11",
  "numpy>=2.3",
  "pandas>=2.3",
  "pyarrow>=21",
  "lightgbm>=4.7",
  "onnxruntime>=1.31",
  "langgraph>=1.2",
  "langgraph-checkpoint-postgres>=3.1",
  "langchain-core>=1.6",
  "langchain-openai>=1.7",
  "openai>=3.31",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.2",
  "pytest-cov>=7.0",
  "hypothesis>=6.169",
  "respx>=0.22",
  "ruff>=0.17",
  "mypy>=2.4",
  "pandas-stubs>=2.3",
  "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yield_guardian"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N"]
ignore = ["S101", "E501"]  # the formatter keeps code at 100 columns; long strings may exceed it

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
